server:
  port: 8084

spring:
  application:
    name: taxiagent-ticket-service
  datasource:
    url: ${TICKET_DB_URL:jdbc:mysql://127.0.0.1:3307/taxiagent_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${TICKET_DB_USERNAME:taxiagent}
    password: ${TICKET_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

taxiagent:
  ticket:
    jwt:
      issuer: ${TICKET_JWT_ISSUER:https://auth.taxiagent.internal}
      audience: ${TICKET_JWT_AUDIENCE:taxiagent-api}
      service-audience: ${TICKET_JWT_SERVICE_AUDIENCE:taxiagent-ticket-service}
      public-key-location: ${TICKET_JWT_PUBLIC_KEY_LOCATION:}
