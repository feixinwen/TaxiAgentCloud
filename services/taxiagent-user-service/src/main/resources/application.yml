server:
  port: 8081

spring:
  application:
    name: taxiagent-user-service
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://127.0.0.1:3307/taxiagent_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${USER_DB_USERNAME:taxiagent}
    password: ${USER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

taxiagent:
  user:
    jwt:
      issuer: ${USER_JWT_ISSUER:https://auth.taxiagent.internal}
      audience: ${USER_JWT_AUDIENCE:taxiagent-api}
      service-audience: ${USER_JWT_SERVICE_AUDIENCE:taxiagent-user-service}
      public-key-location: ${USER_JWT_PUBLIC_KEY_LOCATION:}
    service-identity:
      auth-service-id: ${USER_AUTH_SERVICE_ID:taxiagent-auth-service}
    location:
      ttl-seconds: ${USER_LOCATION_TTL_SECONDS:1800}
  rocketmq:
    name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:taxiagent-user-producer}
    enabled: ${ROCKETMQ_ENABLED:true}
