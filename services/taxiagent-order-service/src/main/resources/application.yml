server:
  port: 8083

spring:
  application:
    name: taxiagent-order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://127.0.0.1:3307/taxiagent_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${ORDER_DB_USERNAME:taxiagent}
    password: ${ORDER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    mongodb:
      uri: ${ORDER_MONGODB_URI:mongodb://127.0.0.1:27017/taxiagent_order}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

taxiagent:
  order:
    jwt:
      issuer: ${ORDER_JWT_ISSUER:https://auth.taxiagent.internal}
      audience: ${ORDER_JWT_AUDIENCE:taxiagent-api}
      service-audience: ${ORDER_JWT_SERVICE_AUDIENCE:taxiagent-order-service}
      public-key-location: ${ORDER_JWT_PUBLIC_KEY_LOCATION:}
    id:
      worker-id: ${ORDER_ID_WORKER_ID:0}
      datacenter-id: ${ORDER_ID_DATACENTER_ID:0}
  amap:
    url: ${AMAP_URL:https://restapi.amap.com/v3}
    key: ${AMAP_KEY:}
    timeout: ${AMAP_TIMEOUT:5000}
