server:
  port: 8082

spring:
  application:
    name: taxiagent-auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://127.0.0.1:3307/taxiagent_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${AUTH_DB_USERNAME:taxiagent}
    password: ${AUTH_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 12
          max-wait: 3000ms
  mail:
    host: ${SPRING_MAIL_HOST:127.0.0.1}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          from: ${MAIL_FROM:taxiagent@test.local}
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

taxiagent:
  auth:
    service-identity:
      service-id: ${AUTH_SERVICE_ID:taxiagent-auth-service}
      token-ttl: ${AUTH_SERVICE_TOKEN_TTL:PT1M}
      user-service-audience: ${AUTH_USER_SERVICE_AUDIENCE:taxiagent-user-service}
      user-service-scopes: user:read,user:write
    id:
      worker-id: ${AUTH_ID_WORKER_ID:0}
      datacenter-id: ${AUTH_ID_DATACENTER_ID:0}
    jwt:
      issuer: ${AUTH_JWT_ISSUER:https://auth.taxiagent.internal}
      audience: ${AUTH_JWT_AUDIENCE:taxiagent-api}
      access-token-ttl: ${AUTH_JWT_ACCESS_TOKEN_TTL:PT15M}
      key-id: ${AUTH_JWT_KEY_ID:taxiagent-auth-key}
      public-key-location: ${AUTH_JWT_PUBLIC_KEY_LOCATION:}
      private-key-location: ${AUTH_JWT_PRIVATE_KEY_LOCATION:}
    verification-code:
      ttl-seconds: 300
      cooldown-seconds: 60
    token:
      refresh-ttl-seconds: 604800
      failed-login-threshold: 5
      lock-duration-seconds: 900
  rocketmq:
    name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP:taxiagent-auth-user-events}
    topic: ${ROCKETMQ_TOPIC:user-events}
    # 默认关闭：测试上下文不连 MQ；本地开发/生产由 local-dev.ps1 或部署环境注入 ROCKETMQ_ENABLED=true
    enabled: ${ROCKETMQ_ENABLED:false}
