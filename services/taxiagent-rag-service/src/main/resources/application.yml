server:
  port: 8086

spring:
  application:
    name: taxiagent-rag-service
  datasource:
    url: ${RAG_DB_URL:jdbc:mysql://127.0.0.1:3307/taxiagent_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${RAG_DB_USERNAME:taxiagent}
    password: ${RAG_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    elasticsearch:
      uris: ${RAG_ES_URIS:http://127.0.0.1:9200}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

taxiagent:
  rag:
    jwt:
      issuer: ${RAG_JWT_ISSUER:https://auth.taxiagent.internal}
      audience: ${RAG_JWT_AUDIENCE:taxiagent-api}
      service-audience: ${RAG_JWT_SERVICE_AUDIENCE:taxiagent-rag-service}
      public-key-location: ${RAG_JWT_PUBLIC_KEY_LOCATION:}
    id:
      worker-id: ${RAG_ID_WORKER_ID:3}
      datacenter-id: ${RAG_ID_DATACENTER_ID:0}
