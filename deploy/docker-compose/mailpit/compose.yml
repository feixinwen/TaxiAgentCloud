name: taxiagent-mailpit

services:
  mailpit:
    image: axllent/mailpit
    container_name: taxiagent-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data

volumes:
  mailpit-data:
