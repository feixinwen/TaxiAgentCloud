apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: taxiagent
  labels:
    app: elasticsearch
    taxiagent.io/data-store: "true"
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        taxiagent.io/data-store: "true"
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          # 社区镜像 baosloan/elasticsearch-ik:8.19.7（docker.elastic.co 直连被墙、无国内官方源）；
          # 本机 docker 经镜像源拉取后导入 containerd，imagePullPolicy=IfNotPresent 直接使用本地镜像
          image: 10.243.194.108:30500/taxiagent/elasticsearch-ik:8.19.7
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          ports:
            - name: http
              containerPort: 9200
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
