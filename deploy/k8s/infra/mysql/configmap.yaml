apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-databases
  namespace: taxiagent
data:
  # 官方 mysql 镜像首次空数据卷启动时按字典序执行 /docker-entrypoint-initdb.d/*.sh
  01-init-databases.sh: |
    #!/bin/sh
    set -e
    mysql_cmd() {
      mysql --protocol=socket -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "$1"
    }
    for db in taxiagent_user taxiagent_auth taxiagent_order taxiagent_ticket taxiagent_rag taxiagent_agent; do
      mysql_cmd "CREATE DATABASE IF NOT EXISTS \`${db}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
    done
    mysql_cmd "CREATE USER IF NOT EXISTS 'taxiagent'@'%' IDENTIFIED BY '${TAXIAGENT_DB_PASSWORD}'"
    for db in taxiagent_user taxiagent_auth taxiagent_order taxiagent_ticket taxiagent_rag taxiagent_agent; do
      mysql_cmd "GRANT ALL PRIVILEGES ON \`${db}\`.* TO 'taxiagent'@'%'"
    done
    mysql_cmd "FLUSH PRIVILEGES"
