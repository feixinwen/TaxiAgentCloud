apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: taxiagent
spec:
  type: NodePort
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
    - name: grpc
      port: 9848
      targetPort: 9848
    - name: console
      port: 8080
      targetPort: 8080
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: nacos-headless
  namespace: taxiagent
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
