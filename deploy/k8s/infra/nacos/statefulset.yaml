apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nacos
  namespace: taxiagent
  labels:
    app: nacos
spec:
  serviceName: nacos-headless
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v3.0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: standalone
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: JVM_XMS
              value: 512m
            - name: JVM_XMX
              value: 512m
            - name: JVM_XMN
              value: 256m
          envFrom:
            - secretRef:
                name: taxiagent-secrets
          ports:
            - name: http
              containerPort: 8848
            - name: grpc
              containerPort: 9848
          startupProbe:
            httpGet:
              path: /nacos/v3/admin/core/state/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /nacos/v3/admin/core/state/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /nacos/v3/admin/core/state/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /home/nacos/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
